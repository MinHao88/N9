<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="N9.COM - 在线平台">
    <meta name="theme-color" content="#e74c3c">
    <title>N9.COM</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
        }
        body { 
            background-color: #f4f6f8; 
            color: #333; 
            padding-bottom: 60px; 
        }
        
        /* ===== 顶部导航 ===== */
        .header { 
            background: #fff; 
            padding: 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
        }
        .header h1 { 
            font-size: 20px; 
            color: #e74c3c; 
            font-weight: 600;
        }
        .lang-btn { 
            background: #eee; 
            border: none; 
            padding: 8px 12px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: 600;
            font-size: 12px;
            transition: all 0.2s;
        }
        .lang-btn:hover {
            background: #ddd;
        }
        .lang-btn:active { 
            background: #ccc; 
        }
        
        /* ===== 页面内容 ===== */
        .content { 
            padding: 15px; 
        }
        .card { 
            background: #fff; 
            padding: 20px; 
            border-radius: 8px; 
            margin-bottom: 15px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
        }
        .card h3 {
            color: #333;
            margin-bottom: 10px;
        }
        .card p {
            font-size: 14px;
            color: #666;
        }
        
        /* ===== 底部导航 ===== */
        .bottom-nav { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            background: #fff; 
            display: flex; 
            justify-content: space-around; 
            padding: 10px 0; 
            box-shadow: 0 -2px 5px rgba(0,0,0,0.05); 
            border-top: 1px solid #eee;
        }
        .nav-item { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            font-size: 12px; 
            cursor: pointer; 
            color: #888; 
            padding: 5px 10px;
            border: none;
            background: transparent;
            transition: color 0.2s;
            flex: 1;
        }
        .nav-item:active {
            color: #e74c3c;
        }
        .nav-item.active { 
            color: #e74c3c; 
            font-weight: bold; 
        }
        .nav-item span { 
            font-size: 20px; 
            margin-bottom: 2px; 
        }
        
        /* ===== 模态框 ===== */
        .modal-mask { 
            position: fixed; 
            top: 0; 
            left: 0; 
            right: 0; 
            bottom: 0; 
            background: rgba(0,0,0,0.5); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 1000;
            animation: fadeIn 0.2s;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal-content { 
            background: #fff; 
            padding: 20px; 
            border-radius: 8px; 
            width: 85%; 
            max-width: 380px;
            animation: slideUp 0.3s;
        }
        @keyframes slideUp {
            from { 
                transform: translateY(20px);
                opacity: 0;
            }
            to { 
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .modal-content h2 { 
            margin-bottom: 15px; 
            color: #e74c3c; 
            text-align: center;
            font-size: 18px;
        }
        
        /* ===== 错误提示 ===== */
        .error-message {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 10px 12px;
            border-radius: 4px;
            margin-bottom: 12px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .error-message::before {
            content: "⚠️";
            font-size: 16px;
        }
        
        /* ===== 输入框 ===== */
        .modal-content input { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 12px; 
            border: 1px solid #ddd; 
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        .modal-content input:focus { 
            outline: none; 
            border-color: #e74c3c;
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.1);
        }
        .modal-content input::placeholder {
            color: #999;
        }
        
        /* ===== 按钮 ===== */
        .modal-content button { 
            width: 100%; 
            padding: 12px; 
            background: #e74c3c; 
            color: #fff; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 16px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .modal-content button:hover {
            background: #d63128;
        }
        .modal-content button:active { 
            background: #c0392b;
        }
        .modal-content button:disabled {
            background: #ccc;
            cursor: not-allowed;
            opacity: 0.7;
        }
        
        /* ===== 加载状态 ===== */
        .btn-loading {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* ===== 切换注册/登录 ===== */
        .modal-content p { 
            text-align: center; 
            margin-top: 12px; 
            color: #888; 
            cursor: pointer; 
            font-size: 13px;
            transition: color 0.2s;
        }
        .modal-content p:hover {
            color: #e74c3c;
        }
        .modal-content p strong {
            color: #e74c3c;
            font-weight: 600;
        }
        
        /* ===== 成功提示 ===== */
        .success-message {
            background: #efe;
            border: 1px solid #cfc;
            color: #3c3;
            padding: 10px 12px;
            border-radius: 4px;
            margin-bottom: 12px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .success-message::before {
            content: "✅";
            font-size: 16px;
        }
    </style>
</head>
<body>

<div id="app">
    <!-- 顶部导航 -->
    <div class="header">
        <h1>N9.COM</h1>
        <button class="lang-btn" @click="toggleLang" :aria-label="'切换语言: ' + currentLangLabel">
            {{ currentLangLabel }}
        </button>
    </div>

    <!-- 页面内容区 -->
    <div class="content">
        <div class="card">
            <h3>{{ t.welcome }}</h3>
            <p style="margin-top:10px;">
                {{ t.monthly_income }}: 
                <strong style="color: #e74c3c; font-size: 16px;">${{ userInfo.balance }}</strong>
            </p>
            <p style="margin-top:8px; font-size: 12px; color: #999;">
                👤 {{ userInfo.username || '未登录' }}
            </p>
            <button v-if="!userInfo.username" 
                    @click="openModal(false)"
                    style="margin-top: 10px; padding: 8px 15px; background: #e74c3c; color: #fff; border: none; border-radius: 4px; cursor: pointer;">
                {{ t.login }}
            </button>
            <button v-else 
                    @click="logout"
                    style="margin-top: 10px; padding: 8px 15px; background: #888; color: #fff; border: none; border-radius: 4px; cursor: pointer;">
                退出登录
            </button>
        </div>
    </div>

    <!-- 底部导航 -->
    <nav class="bottom-nav" role="tablist">
        <button class="nav-item" :class="{active: currentTab === 'home'}" 
                @click="switchTab('home')" role="tab" :aria-selected="currentTab === 'home'">
            <span>🏠</span> {{ t.home }}
        </button>
        <button class="nav-item" :class="{active: currentTab === 'activity'}" 
                @click="switchTab('activity')" role="tab" :aria-selected="currentTab === 'activity'">
            <span>🎁</span> {{ t.activity }}
        </button>
        <button class="nav-item" :class="{active: currentTab === 'profile'}" 
                @click="switchTab('profile')" role="tab" :aria-selected="currentTab === 'profile'">
            <span>👤</span> {{ t.profile }}
        </button>
    </nav>

    <!-- 登录/注册弹窗 -->
    <div v-if="showModal" class="modal-mask" @click.self="closeModal" role="dialog" aria-modal="true">
        <div class="modal-content">
            <h2>{{ showRegister ? t.register : t.login }}</h2>
            
            <!-- 错误提示 -->
            <div v-if="error" class="error-message">
                {{ error }}
            </div>
            
            <!-- 登录/注册表单 -->
            <input 
                v-model="username" 
                :placeholder="t.username_ph"
                @keyup.enter="handleLogin"
                :disabled="isLoading"
                type="text"
            >
            <input 
                v-model="password" 
                type="password" 
                :placeholder="t.password_ph"
                @keyup.enter="handleLogin"
                :disabled="isLoading"
            >
            
            <!-- 注册时显示确认密码字段 -->
            <input 
                v-if="showRegister"
                v-model="confirmPassword" 
                type="password" 
                :placeholder="t.confirm_password_ph"
                @keyup.enter="handleLogin"
                :disabled="isLoading"
            >
            
            <!-- 提交按钮 -->
            <button @click="handleLogin" :disabled="isLoading">
                <span v-if="!isLoading">{{ showRegister ? t.register : t.login }}</span>
                <span v-else class="btn-loading">
                    <span class="spinner"></span>
                    加载中...
                </span>
            </button>
            
            <!-- 切换登录/注册 -->
            <p @click="toggleAuthMode" v-if="!isLoading">
                {{ showRegister ? t.login : t.register }}
            </p>
        </div>
    </div>
</div>

<!-- 引入 Vue 2 -->
<script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.min.js"></script>
<!-- 引入你的 JS 文件 -->
<script src="app.js"></script>

</body>
</html>

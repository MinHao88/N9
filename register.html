<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>APP注册页面</title>
    <!-- 引入 FontAwesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- 基础重置与变量 --- */
        :root {
            --primary-gold: #bfa05f;
            --primary-brown: #8c6239;
            --text-dark: #333;
            --text-gray: #999;
            --border-color: #e0e0e0;
            --error-red: #ff4d4f;
            --success-green: #52c41a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-dark);
        }

        /* --- 容器与布局 --- */
        .container {
            width: 100%;
            max-width: 400px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
            padding-bottom: 20px;
        }

        /* 顶部 Banner */
        .banner {
            text-align: center;
            padding: 20px 15px;
            background: linear-gradient(to bottom, #fff, #fafafa);
        }
        .logo-area {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            gap: 8px;
        }
        .logo-icon { font-size: 24px; color: var(--primary-gold); }
        .logo-text { font-size: 20px; font-weight: bold; color: var(--primary-brown); letter-spacing: 1px; }
        .promo-list { font-size: 12px; line-height: 1.6; color: #555; }
        .highlight { color: var(--error-red); font-weight: bold; font-size: 14px; }

        /* Tab 切换 */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }
        .tab-item {
            flex: 1;
            text-align: center;
            padding: 12px;
            font-size: 16px;
            color: var(--text-gray);
            cursor: pointer;
            position: relative;
        }
        .tab-item.active {
            color: var(--primary-brown);
            font-weight: bold;
        }
        .tab-item.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 3px;
            background-color: var(--primary-brown);
            border-radius: 2px;
        }

        /* 表单区域 */
        .form-group {
            padding: 0 20px;
            margin-bottom: 15px;
            position: relative;
        }
        .input-wrapper {
            display: flex;
            align-items: center;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0 12px;
            height: 48px;
            transition: border-color 0.3s;
        }
        .input-wrapper:focus-within { border-color: var(--primary-brown); }
        .input-icon { color: var(--text-gray); margin-right: 10px; font-size: 16px; }
        .form-input {
            border: none;
            flex: 1;
            height: 100%;
            font-size: 14px;
            background: transparent;
        }
        .eye-icon { color: var(--text-gray); cursor: pointer; padding: 5px; }

        /* 区号选择器 */
        .country-code-select {
            border: none;
            border-right: 1px solid var(--border-color);
            padding-right: 10px;
            margin-right: 10px;
            color: var(--text-dark);
            font-size: 14px;
            background: transparent;
            appearance: none; /* 移除默认箭头 */
        }

        /* 密码强度条 */
        .strength-bar-container {
            display: flex;
            gap: 4px;
            margin-top: 8px;
        }
        .strength-segment {
            height: 4px;
            flex: 1;
            background-color: #eee;
            border-radius: 2px;
            transition: background-color 0.3s;
        }

        /* 提示文字 */
        .hint-text {
            font-size: 12px;
            color: #ff9800; /* 橙色警告 */
            margin-top: 6px;
            display: block;
        }

        /* 协议勾选 */
        .agreement-box {
            display: flex;
            align-items: center;
            padding: 0 20px;
            margin-bottom: 20px;
            font-size: 12px;
            color: #666;
        }
        .custom-checkbox {
            width: 16px;
            height: 16px;
            border: 1px solid var(--success-green);
            background-color: var(--success-green);
            border-radius: 3px;
            margin-right: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 10px;
            cursor: pointer;
        }

        /* 按钮 */
        .submit-btn {
            display: block;
            width: calc(100% - 40px);
            margin: 0 auto;
            height: 48px;
            background: linear-gradient(90deg, #8c6239, #bfa05f);
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(140, 98, 57, 0.3);
        }
        .submit-btn:active { opacity: 0.9; transform: scale(0.98); }

        /* 底部链接 */
        .footer-links {
            display: flex;
            justify-content: space-between;
            padding: 20px 40px;
            font-size: 13px;
            color: var(--text-gray);
        }

        /* 关闭按钮 */
        .close-btn {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 36px;
            height: 36px;
            background: rgba(0,0,0,0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        /* 语言切换悬浮球 */
        .lang-switcher {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 10;
        }
        .lang-select {
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #ddd;
            font-size: 12px;
            background: #fff;
        }

        /* 错误状态 */
        .error-shake { animation: shake 0.5s; border-color: var(--error-red) !important; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 语言切换 -->
    <div class="lang-switcher">
        <select id="languageSelect" class="lang-select">
            <option value="zh">中文</option>
            <option value="my">မြန်မာစာ</option>
            <option value="en">English</option>
        </select>
    </div>

    <!-- 顶部 Banner -->
    <div class="banner">
        <div class="logo-area">
            <i class="fas fa-crown logo-icon"></i>
            <span class="logo-text" data-i18n="appName">澳门威尼斯人</span>
        </div>
        <div class="promo-list">
            <p><span data-i18n="promo1">首存复存最高可领取</span> <span class="highlight">6888元</span></p>
            <p><span data-i18n="promo2">下载APP就送</span> <span class="highlight">888元</span></p>
            <p><span data-i18n="promo3">每日千万红包派送</span></p>
        </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <div class="tab-item active" data-tab="register" data-i18n="tabRegister">注册</div>
        <div class="tab-item" data-tab="login" data-i18n="tabLogin">登录</div>
    </div>

    <!-- 注册表单 -->
    <form id="registerForm">
        <!-- 账号输入 -->
        <div class="form-group">
            <div class="input-wrapper" id="phoneWrapper">
                <i class="fas fa-user input-icon"></i>
                <select class="country-code-select">
                    <option value="+86">+86</option>
                    <option value="+95">+95</option>
                    <option value="+1">+1</option>
                </select>
                <input type="tel" class="form-input" id="phoneInput" placeholder="请输入手机号码/账号" data-i18n-placeholder="phPhone">
            </div>
        </div>

        <!-- 密码输入 -->
        <div class="form-group">
            <div class="input-wrapper" id="pwdWrapper">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" class="form-input" id="pwdInput" placeholder="请输入密码" data-i18n-placeholder="phPwd">
                <i class="fas fa-eye eye-icon" id="togglePwd"></i>
            </div>
            <!-- 密码强度条 -->
            <div class="strength-bar-container">
                <div class="strength-segment" id="seg1"></div>
                <div class="strength-segment" id="seg2"></div>
                <div class="strength-segment" id="seg3"></div>
                <div class="strength-segment" id="seg4"></div>
            </div>
        </div>

        <!-- 真实姓名 -->
        <div class="form-group">
            <div class="input-wrapper">
                <i class="fas fa-users input-icon"></i>
                <input type="text" class="form-input" id="nameInput" placeholder="请输入真实姓名" data-i18n-placeholder="phName">
            </div>
            <small class="hint-text" data-i18n="nameHint">必须与您的提款银行账户同名</small>
        </div>

        <!-- 协议 -->
        <div class="agreement-box">
            <div class="custom-checkbox"><i class="fas fa-check"></i></div>
            <span data-i18n="agreementText">我已满18岁,已阅读且同意《用户协议》</span>
        </div>

        <!-- 提交按钮 -->
        <button type="button" class="submit-btn" id="submitBtn" data-i18n="btnRegister">注 册</button>

        <!-- 底部链接 -->
        <div class="footer-links">
            <span data-i18n="linkService">联系客服</span>
            <span data-i18n="linkDemo">免费试玩</span>
        </div>
    </form>

    <!-- 关闭按钮 -->
    <div class="close-btn" onclick="alert('关闭弹窗')">
        <i class="fas fa-times"></i>
    </div>
</div>

<script>
    // --- 1. 多语言字典 ---
    const i18nData = {
        zh: {
            appName: "澳门威尼斯人",
            promo1: "首存复存最高可领取",
            promo2: "下载APP就送",
            promo3: "每日千万红包派送",
            tabRegister: "注册",
            tabLogin: "登录",
            phPhone: "请输入手机号码/账号",
            phPwd: "请输入密码",
            phName: "请输入真实姓名",
            nameHint: "必须与您的提款银行账户同名",
            agreementText: "我已满18岁,已阅读且同意《用户协议》",
            btnRegister: "注 册",
            linkService: "联系客服",
            linkDemo: "免费试玩"
        },
        my: {
            appName: "Macau Venetian",
            promo1: "ပထမအကြိမ်သွင်းငွေ အများဆုံးရရှိနိုင်သည်",
            promo2: "APP ဒေါင်းလုပ်ဆွဲပါက ရရှိမည်",
            promo3: "နေ့တိုင်း လက်ဆောင်များ",
            tabRegister: "မှတ်ပုံတင်ရန်",
            tabLogin: "ဝင်ရောက်ရန်",
            phPhone: "ဖုန်းနံပါတ်/အကောင့် ထည့်ပါ",
            phPwd: "စကားဝှက် ထည့်ပါ",
            phName: "အမည်အစစ် ထည့်ပါ",
            nameHint: "ဘဏ်အကောင့်အမည်နှင့် တူညီရမည်",
            agreementText: "ကျွန်ုပ်သည် ၁၈ နှစ်ပြည့်ပြီးဖြစ်သည်",
            btnRegister: "မှတ်ပုံတင်ရန်",
            linkService: "ဝန်ဆောင်မှု",
            linkDemo: "အခမဲ့ စမ်းသပ်ရန်"
        },
        en: {
            appName: "Macau Venetian",
            promo1: "First deposit bonus up to",
            promo2: "Download App get",
            promo3: "Daily Red Packets",
            tabRegister: "Register",
            tabLogin: "Login",
            phPhone: "Enter Phone/Account",
            phPwd: "Enter Password",
            phName: "Enter Real Name",
            nameHint: "Must match bank account name",
            agreementText: "I am 18+, agree to Terms",
            btnRegister: "REGISTER",
            linkService: "Customer Service",
            linkDemo: "Free Play"
        }
    };
        // 1. 定义执行翻译的函数
    function switchLanguage(lang) {
        const data = i18nData[lang]; // 获取对应语言的字典数据
        
        // 更新页面各个部分的文字 (请确保你的 HTML 元素有对应的 class 或 id)
        document.querySelector('h2').innerText = data.title;
        document.getElementById('username').placeholder = data.usernamePlaceholder;
        document.querySelector('.pwd-label').innerText = data.passwordLabel;
        document.querySelector('.strength-text').innerText = data.pwdStrengthText;
        document.querySelector('.btn-submit').innerText = data.submitBtn;
        
        // 更新按钮的高亮状态
        langBtns.forEach(btn => {
            if (btn.dataset.lang === lang) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
    }
    
    // 2. 给所有语言按钮添加点击事件
    langBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            const lang = btn.dataset.lang; // 获取按钮上标记的语言 (zh 或 en)
            switchLanguage(lang); // 调用上面的函数进行切换
        });
    });
    
    // 3. 初始化：默认加载中文
    switchLanguage('zh');
    
    }); // 这是整个 DOMContentLoaded 事件的结束大括号

    // --- 2. 逻辑控制 ---
    document.addEventListener('DOMContentLoaded', () => {
        const pwdInput = document.getElementById('pwdInput');
        const togglePwd = document.getElementById('togglePwd');
        const submitBtn = document.getElementById('submitBtn');
        const phoneInput = document.getElementById('phoneInput');
        const nameInput = document.getElementById('nameInput');
        const segments = [document.getElementById('seg1'), document.getElementById('seg2'), document.getElementById('seg3'), document.getElementById('seg4')];
        const langSelect = document.getElementById('languageSelect');

// A. 密码显隐切换
togglePwd.addEventListener('click', () => {
    // 1. 获取当前输入框的类型，进行 password 和 text 的切换
    const isPassword = pwdInput.getAttribute('type') === 'password';
    pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
    
    // 2. 切换图标样式 (睁眼/闭眼)
    // 如果原本是密码，点击后变成明文，图标变为“闭眼/带斜线”
    // 如果原本是明文，点击后变成密码，图标变为“睁眼”
    togglePwd.classList.toggle('fa-eye');
    togglePwd.classList.toggle('fa-eye-slash');
});

// B. 密码强度检测 (监听输入框变化)
pwdInput.addEventListener('input', function() {
    const val = this.value;
    let strength = 0;
    
    // 计算强度规则
    if (val.length > 0) {
        if (val.length >= 6) strength++; // 长度
        if (/\d/.test(val)) strength++; // 数字
        if (/[a-zA-Z]/.test(val) || /[^A-Za-z0-9]/.test(val)) strength++; // 字母或符号
    }
    
    // 更新 UI 显示
    const bars = document.querySelectorAll('.strength-bar');
    
    // 遍历每一个小方块
    bars.forEach((bar, index) => {
        // 1. 默认先设为灰色 (未激活状态)
        bar.style.backgroundColor = '#e0e0e0';
        
        // 2. 如果当前方块的索引小于强度值，则点亮颜色
        if (index < strength) {
            if (strength === 1) {
                bar.style.backgroundColor = '#ff4d4f'; // 弱 - 红
            } else if (strength === 2) {
                bar.style.backgroundColor = '#faad14'; // 中 - 橙
            } else if (strength >= 3) {
                bar.style.backgroundColor = '#52c41a'; // 强 - 绿
            }
        }
    });
    // D. 注册按钮点击事件
submitBtn.addEventListener('click', (e) => {
    e.preventDefault(); // 阻止表单默认提交刷新页面
    
    // 获取用户输入的值
    const username = document.getElementById('username').value.trim();
    const password = pwdInput.value;
   
    // 简单的非空验证
    if (!username || !password) {
        alert('请填写完整的用户名和密码！');
        return;
    }
    
    
    // 2. 模拟发送数据到后端 (这里只是演示)
console.log("正在注册...", username, password);

// 3. 给用户成功反馈
alert(`注册成功！欢迎你，${username}！`);

// 4. 可选：清空表单，方便下一次输入
document.getElementById('username').value = '';
pwdInput.value = '';

});
// 【第 503 行】结束 submitBtn 的点击事件

// ==========================================
// E. 密码强度检测 (Password Strength)
// ==========================================
pwdInput.addEventListener('input', function() {
    const val = this.value;
    let strength = 0;
    
    // 简单的强度算法
    if (val.length > 5) strength++; // 长度大于5
    if (val.match(/[A-Z]/)) strength++; // 包含大写字母
    if (val.match(/[0-9]/)) strength++; // 包含数字
    
    // 更新 UI 显示
    const bars = document.querySelectorAll('.strength-bar');
    
    bars.forEach((bar, index) => {
        // 1. 先把所有小方块重置为灰色
        bar.style.backgroundColor = '#e0e0e0';
        
        // 2. 如果当前方块的索引(index)小于计算出的强度值(strength)，就点亮它
        if (index < strength) {
            // 根据强度设置颜色：1=红色(弱), 2=橙色(中), 3=绿色(强)
            if (strength === 1) bar.style.backgroundColor = '#ff4d4f';
            else if (strength === 2) bar.style.backgroundColor = '#faad14';
            else if (strength >= 3) bar.style.backgroundColor = '#52c41a';
        }
    });
}); // 结束 pwdInput 监听

// ==========================================
// F. 多语言切换 (Language Switcher)
// ==========================================
const langBtns = document.querySelectorAll('.lang-btn');
let currentLang = 'zh'; // 默认中文

// 定义语言包对象
const i18nData = {
    zh: {
        title: "用户注册",
        usernamePlaceholder: "请输入用户名",
        passwordLabel: "密码",
        pwdStrengthText: "密码强度",
        submitBtn: "立即注册"
    },
    en: {
        title: "User Registration",
        usernamePlaceholder: "Enter Username",
        passwordLabel: "Password",
        pwdStrengthText: "Password Strength",
        submitBtn: "Register Now"
    }
};

// 切换语言的函数
function switchLanguage(lang) {
    currentLang = lang;
    const data = i18nData[lang];
    
    // 更新页面文本 (假设你有对应的 ID)
    if (document.querySelector('h2')) document.querySelector('h2').innerText = data.title;
    if (document.getElementById('username')) document.getElementById('username').placeholder = data.usernamePlaceholder;
    if (document.querySelector('label[for="password"]')) document.querySelector('label[for="password"]').innerText = data.passwordLabel;
    if (document.getElementById('submitBtn')) document.getElementById('submitBtn').value = data.submitBtn;
    
    // 可以在这里添加更多元素的更新逻辑...
}

// 给语言按钮添加点击事件
langBtns.forEach(btn => {
btn.addEventListener('click', (e) => {
    const lang = e.target.dataset.lang; // 获取按钮上的 data-lang 属性
    switchLanguage(lang);
});
});

}); // 【最后一行】结束整个页面的 DOMContentLoaded 事件
